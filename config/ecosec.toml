# =============================================================================
# Contexto do acesso: MFA adaptativo e step-up (ecosec/seguranca/acesso/contexto.py)
# =============================================================================

[contexto]
# Sinais do login: estação (computador + conta do Windows) nova e erros recentes. 1 sinal =
# risco MEDIO (prova de vida já no login); os 2 = ALTO (prova de vida, e a sessão vale só para
# consulta: sem N3 nem exportação). Horário não é sinal: não há expediente no sistema, e o
# dia e a hora do acesso nunca restringem nenhum nível.
ativo = true
# Step-up: exportar dados nominais (N2) exige o rosto conferido há no máximo N minutos;
# depois disso, a câmera confere de novo antes de o arquivo sair.
verificacao_minutos = 5

# =============================================================================
# Geração do acervo: séries temporais com entradas e saídas
# =============================================================================
# O estoque de pendências ativas é o acumulado de entradas menos saídas. Cada linha de
# geração tem um risco de saída por pendência ativa (1/ano). Duas calibrações:
#   metas  = razões entre fluxos de saída de anos diferentes: [ano, relativo a, razão];
#   ancora = fixa o NÍVEL do risco: ["FRACAO", de, até, fração encerrada] ou
#            ["NIVEL", ano, saídas/entradas]. Sem âncora, vale risco_base.
# verificacao: CONFIRMADO = conferido na fonte citada; PARAMETRO = parâmetro de simulação, sem fonte primária.
# latencia = anos de casa antes de a pendência poder sair: sem ela, o risco constante
#            desde a entrada encerrava áreas contaminadas em semanas. Muda QUEM sai, não quantos.
# Mudou algo aqui? O acervo precisa ser recriado: python -m ferramentas.preparar_banco --recriar-acervo
[geracao]
quantidade = 2400
# estratificado: contagens anuais = esperado com arredondamento sistemático (padrão);
# poisson: contagens sorteadas (para volumes grandes)
modo = "estratificado"

[geracao.saidas.postos]
# Borges (USP): 28% dos postos do banco da CETESB reabilitados entre 2002 e 2019
ancora = ["FRACAO", 2006, 2019, 0.28]
metas = [[2020, 2019, 0.95], [2021, 2019, 0.90], [2022, 2021, 1.19]]
verificacao = "CONFIRMADO"
latencia = 2.0

[geracao.saidas.area]
ancora = ["NIVEL", 2019, 1.00]        # hipótese: em 2019 as áreas contaminadas saem no mesmo ritmo em que entram
metas = [[2020, 2019, 0.95], [2021, 2019, 0.90], [2022, 2021, 1.19]]
verificacao = "PARAMETRO"
latencia = 2.0

[geracao.saidas.classe_i]
ancora = ["NIVEL", 2019, 0.90]        # hipótese: saídas/entradas de resíduo Classe I em 2019
metas = [[2021, 2020, 1.30]]          # MTR obrigatório (Portaria MMA 280/2020) força baixas
verificacao = "PARAMETRO"
latencia = 0.25

[geracao.saidas.aterros]
risco_base = 0.08
verificacao = "PARAMETRO"
latencia = 1.5

[geracao.saidas.mtr_sem_baixa]
risco_base = 0.50                     # baixa tardia ou autuação (permanência média de ~2 anos)
verificacao = "PARAMETRO"
latencia = 0.05

[geracao.saidas.fontes_seladas]
risco_base = 0.08
metas = [[2023, 2022, 3.52], [2024, 2023, 0.54]]   # 377/107; 202/377 (2024 anualizado)
anualizar_parcial = false             # true: 2024 = (202 x 12/5) / 377 = 1,29
verificacao = "PARAMETRO"
latencia = 0.25

[geracao.saidas.norm]
risco_base = 0.0                      # legado minerário e Goiânia: estoque herdado, sem saída
verificacao = "PARAMETRO"
latencia = 0.0  # NORM não sai (risco 0): a latência não se aplica

[geracao.saidas.garimpo]
risco_base = 0.01                     # remoção de balsas em operações
verificacao = "PARAMETRO"
latencia = 2.0

[indice_pressao]
# Índice de Pressão por UF (N1): soma ponderada dos postos percentis entre as 27 UFs (pesos somam 1)
peso_volume = 0.30
peso_severidade = 0.30
peso_custo = 0.20
peso_atraso = 0.20
# menos que isto de pendências ativas numa UF: a dica mostra "MENOS DE N" (supressão de célula pequena)
supressao_minima = 3

[documentos]
# true: a janela do documento sai preta em capturas e compartilhamentos de tela (Windows 10 2004+).
# Desligado por padrão: ligado, também esconde o documento numa apresentação com tela compartilhada.
bloquear_captura = false
